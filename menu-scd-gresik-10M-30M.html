<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YongWeproperty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>Secondary Gresik</h1>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Cari Property">
            <select id="filterDropdown">
                <option value="semua">Semua Kategori</option>
                <option value="Rumah">🏠 Rumah</option>
                <option value="Apartment">🏢 Apartment</option>
                <option value="Tanah">🌳 Tanah</option>
                <option value="Gudang">🏬 Gudang</option>
                <option value="Ruko">🏪 Ruko</option>
                <option value="Pabrik">🏭 Pabrik</option>
                <option value="Rumah Usaha">🏪 Rumah Usaha</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="gallery" id="gallery">
            <div class="photo-card" data-name="Tanah">

                <div class="slider-wrapper" title="Klik untuk melihat foto selanjutnya">
                    <div class="slider-track">
                        <!-- Saya ubah ke foto 2 agar sesuai dengan daftar gambar di foldermu -->
                        <img src="scd-grs-10M-30M (3).jpeg" alt="Tampak Dalam">
                        <img src="scd-grs-10M-30M (1).jpeg" alt="Tampak Dalam">
                        <img src="scd-grs-10M-30M (2).jpeg" alt="Tampak Dalam">
                        <img src="scd-grs-10M-30M (4).jpeg" alt="Tampak Dalam">
                    </div>
                    <div class="click-hint">Klik foto 👆</div>
                </div>

                <!-- Area Spesifikasi / Teks -->
                <div class="card-content">
                    <span class="badge-lokasi">Tanah Raya Dadap Kuning, Cerme</span>
                    <h2 class="card-title">Tanah Raya Dadap Kuning</h2>

                    <div class="card-specs">
                        <p><strong>LT:</strong> 8610| <strong>LB:</strong> 0 m²</p>
                        <p><strong>Lantai: 1</strong> | <strong>Surat:</strong> SHM</p>
                        <p><strong>Kamar Tidur: 0</strong> | <strong>Kamar Mandi: 0</strong></p>
                        <p>Lebar 38 meter</p>
                        <br>
                        <p>Segera Hubungi: <br>
                            YongWe Property</p>
                    </div>

                    <div class="card-price">
                        <span class="harga-promo">15 M Nego<small></small></span>
                        <p class="pajak-info">(1.7 Jutaan/m2)</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
